<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="ZT IT HUB provides modern web development, mobile app development, UI/UX design, and backend solutions." />
    <link rel="icon" type="image/png" href="/src/assets/brand-logo-transparent.png" />
    <link rel="apple-touch-icon" href="/src/assets/brand-logo-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ZT IT HUB</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme');
        const initialTheme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : 'light';
        document.documentElement.dataset.theme = initialTheme;
      } catch {
      document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
